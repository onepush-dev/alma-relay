name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Dockerfile", "railway/**", ".github/workflows/publish-ghcr.yml"]
concurrency:
  group: ghcr
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/onepush-dev/alma-relay:1.4.0
          platforms: linux/amd64
          labels: org.opencontainers.image.source=https://github.com/onepush-dev/alma-relay
